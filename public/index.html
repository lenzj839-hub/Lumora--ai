
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10091d">
  <title>Lumora AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0e0818;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 17px;
      background: #160d23;
      border-bottom: 1px solid #352344;
      position: sticky;
      top: 0;
    }

    header h2 { margin: 0; }

    header p {
      margin: 5px 0 0;
      color: #c9b8d8;
      font-size: 13px;
    }

    #chat {
      max-width: 850px;
      margin: auto;
      padding: 18px 12px 140px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      padding: 13px 15px;
      max-width: 90%;
      border-radius: 17px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(120deg, #8539e8, #d83fb4);
    }

    .ai {
      align-self: flex-start;
      background: #251436;
    }

    .sources {
      margin-top: 12px;
      border-top: 1px solid #514060;
      padding-top: 8px;
    }

    .sources a {
      display: block;
      color: #dfbfff;
      margin: 7px 0;
    }

    .generated-image {
      display: block;
      max-width: 100%;
      width: 100%;
      margin-top: 12px;
      border-radius: 12px;
    }

    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a0e29;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid #352344;
    }

    .composer-inner {
      display: flex;
      gap: 9px;
      max-width: 850px;
      margin: auto;
    }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 52px;
      max-height: 130px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #493458;
      border-radius: 16px;
      background: #10091d;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 50%;
      width: 52px;
      min-width: 52px;
      height: 52px;
      background: linear-gradient(120deg, #8539e8, #d83fb4);
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }

    .small {
      text-align: center;
      color: #bba9ca;
      font-size: 11px;
      margin-top: 7px;
    }
  </style>
</head>

<body>
  <header>
    <h2>✨ Lumora AI</h2>
    <p>Your assistant for questions, web search and images</p>
  </header>

  <main id="chat" aria-live="polite">
    <div class="message ai">
      Hi! I'm Lumora AI. What can I help you with today?
    </div>
  </main>

  <div class="composer">
    <div class="composer-inner">
      <textarea
        id="input"
        placeholder="Ask Lumora anything..."
        aria-label="Your message"
      ></textarea>

      <button id="send" aria-label="Send">➤</button>
    </div>
    <div class="small">
      For images, type: Generate an image of...
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    const history = [];

    function addMessage(role, text, extras = {}) {
      const bubble = document.createElement("div");
      bubble.className =
        "message " + (role === "user" ? "user" : "ai");

      const textNode = document.createElement("div");
      textNode.textContent = text;
      bubble.appendChild(textNode);

      if (extras.image) {
        const img = document.createElement("img");
        img.className = "generated-image";
        img.src = extras.image;
        img.alt = "Image generated by Lumora AI";
        bubble.appendChild(img);
      }

      if (extras.sources?.length) {
        const sourcesBox = document.createElement("div");
        sourcesBox.className = "sources";

        const heading = document.createElement("strong");
        heading.textContent = "Sources";
        sourcesBox.appendChild(heading);

        extras.sources.forEach(source => {
          const link = document.createElement("a");
          link.href = source.link;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = source.title || source.link;
          sourcesBox.appendChild(link);
        });

        bubble.appendChild(sourcesBox);
      }

      chat.appendChild(bubble);
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

      return bubble;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message || send.disabled) return;

      addMessage("user", message);
      input.value = "";
      send.disabled = true;

      const waiting = addMessage("ai", "Thinking...");

      try {
        // Image requests use a separate backend endpoint.
        const wantsImage =
          /\b(generate|create|make|draw)\b.*\b(image|picture|illustration|logo)\b/i
            .test(message);

        const endpoint = wantsImage
          ? "/api/image"
          : "/api/chat";

        const body = wantsImage
          ? { prompt: message }
          : { message, history };

        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        const data = await response.json();
        waiting.remove();

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        if (wantsImage) {
          addMessage(
            "ai",
            data.image
              ? "Here is your generated image!"
              : data.error || "I couldn't generate that image.",
            { image: data.image }
          );
        } else {
          const reply = data.reply ||
            data.error ||
            "Please try asking again.";

          addMessage("ai", reply, {
            sources: data.sources || []
          });

          history.push(
            { role: "user", content: message },
            { role: "assistant", content: reply }
          );

          // Keep recent context without sending an unlimited history.
          if (history.length > 10) {
            history.splice(0, history.length - 10);
          }
        }
      } catch (error) {
        waiting.remove();
        addMessage(
          "ai",
          "Sorry, something went wrong: " + error.message
        );
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
