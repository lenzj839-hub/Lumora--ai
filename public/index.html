<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMORA AI - By John Theuri</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Space Grotesk',sans-serif;background:#0f0a1a;color:white;margin:0}
.chat::-webkit-scrollbar{width:0}
.bubble{max-width:85%;border-radius:20px;padding:12px 16px;word-wrap:break-word}
.user{background:linear-gradient(135deg,#7c3aed,#a855f7);border-bottom-right-radius:4px}
.bot{background:#1e1433;border-bottom-left-radius:4px;border:1px solid #2d1f4a}
.sidebar{transform:translateX(-100%);transition:0.3s;z-index:50}
.sidebar.open{transform:translateX(0)}
.overlay{display:none}
.overlay.show{display:block}
</style>
</head>
<body class="flex h-screen overflow-hidden">

<!-- SIDEBAR LIKE META AI SCREENSHOT -->
<div id="overlay" class="overlay fixed inset-0 bg-black/60 z-40" onclick="closeSidebar()"></div>

<div id="sidebar" class="sidebar fixed left-0 top-0 h-full w-[300px] bg-[#0f0a1a] border-r border-purple-900/30 flex flex-col z-50">
  <!-- Search -->
  <div class="p-4">
    <div class="flex items-center gap-2 bg-[#1a122e] rounded-full px-4 py-3">
      <span>🔍</span>
      <input placeholder="Search" class="bg-transparent outline-none text-sm w-full">
    </div>
  </div>

  <!-- Menu Icons like screenshot -->
  <div class="px-4 space-y-1">
    <button onclick="newChat()" class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-[#1e1433] text-left">
      <span class="text-xl">📝</span><span class="text-sm">New chat</span>
    </button>
    <button class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-[#1e1433] text-left">
      <span class="text-xl">🖼️</span><span class="text-sm">Media</span>
    </button>
    <button class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-[#1e1433] text-left">
      <span class="text-xl">🧩</span><span class="text-sm">Artefacts</span>
    </button>
    <button class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-[#1e1433] text-left">
      <span class="text-xl">🗓️</span><span class="text-sm">Scheduled</span>
    </button>
    <button class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-[#1e1433] text-left">
      <span class="text-xl">👓</span><span class="text-sm">Glasses</span>
    </button>
    <button class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-[#1e1433] text-left">
      <span class="text-xl">▶️</span><span class="text-sm">Vibes</span>
    </button>
  </div>

  <!-- Chats History like screenshot -->
  <div class="mt-6 px-4 flex-1 overflow-y-auto">
    <div class="text-xs text-zinc-500 mb-3 font-semibold">Chats</div>
    <div id="chatsList" class="space-y-1"></div>
  </div>

  <!-- Bottom icons -->
  <div class="p-4 flex justify-center gap-3 border-t border-purple-900/20">
    <button class="w-10 h-10 rounded-full bg-[#1e1433] flex items-center justify-center">🔔</button>
    <button class="w-10 h-10 rounded-full bg-[#1e1433] flex items-center justify-center">⚙️</button>
  </div>
</div>

<!-- MAIN -->
<div class="flex-1 flex flex-col">
  <!-- Header -->
  <div class="p-4 flex justify-between items-center border-b border-purple-900/30 bg-[#0f0a1a]">
    <div class="flex items-center gap-3">
      <button onclick="openSidebar()" class="w-10 h-10 rounded-full bg-[#1e1433] flex items-center justify-center">☰</button>
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">✨</div>
      <div>
        <div class="font-bold tracking-widest text-sm">LUMORA AI</div>
        <div class="text-[10px] text-purple-300">By John Theuri • https://lumora-ai-ncmb.onrender.com</div>
      </div>
    </div>
    <button onclick="newChat()" class="px-4 py-2 rounded-full bg-[#1e1433] border border-purple-800 text-xs">Clear</button>
  </div>

  <!-- Chat -->
  <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4 chat"></div>

  <div class="px-4 py-2 text-[11px] text-zinc-500">💡 Tip: Tap ☰ to see saved chats • Send pic + "Make beautiful" = AI edit like ChatGPT!</div>

  <!-- Input -->
  <div class="p-3 bg-[#0f0a1a] border-t border-purple-900/20">
    <div class="flex items-center gap-2 bg-[#1a122e] rounded-full p-2 border border-purple-900/30">
      <button id="cameraBtn" class="w-9 h-9 rounded-full bg-[#241a3d] flex items-center justify-center">📷</button>
      <button id="galleryBtn" class="w-9 h-9 rounded-full bg-[#241a3d] flex items-center justify-center">🖼️</button>
      <input id="msgInput" class="flex-1 bg-transparent outline-none px-2 text-sm" placeholder="Message Lumora...">
      <button id="micBtn" class="w-9 h-9 rounded-full bg-[#241a3d] flex items-center justify-center">🎤</button>
      <button id="sendBtn" class="w-9 h-9 rounded-full bg-gradient-to-br from-purple-600 to-purple-400 flex items-center justify-center">➤</button>
    </div>
    <div class="text-[9px] text-center text-zinc-600 mt-2">Made for John Theuri • Backend https://lumora-ai-ncmb.onrender.com/api/chat</div>
  </div>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galleryInput" accept="image/*" hidden>

<script>
const API_URL = 'https://lumora-ai-ncmb.onrender.com/api/chat';
const chat = document.getElementById('chat');
const input = document.getElementById('msgInput');

let allChats = JSON.parse(localStorage.getItem('lumora_all_chats')||'{}');
let currentChatId = localStorage.getItem('lumora_current_id') || Date.now().toString();
if(!allChats[currentChatId]) allChats[currentChatId] = {title:'New Chat', messages:[]};

function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show'); renderChatsList();}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}

function saveAll(){localStorage.setItem('lumora_all_chats', JSON.stringify(allChats)); localStorage.setItem('lumora_current_id', currentChatId); renderChatsList();}

function newChat(){
  currentChatId = Date.now().toString();
  allChats[currentChatId] = {title:'New Chat', messages:[]};
  saveAll();
  renderMessages();
  closeSidebar();
}

function loadChat(id){
  currentChatId = id;
  localStorage.setItem('lumora_current_id', id);
  renderMessages();
  closeSidebar();
}

function renderChatsList(){
  const list = document.getElementById('chatsList');
  list.innerHTML='';
  const ids = Object.keys(allChats).sort((a,b)=>b-a);
  ids.forEach(id=>{
    const c = allChats[id];
    const div = document.createElement('div');
    div.className = `px-3 py-3 rounded-xl hover:bg-[#1e1433] cursor-pointer text-sm flex justify-between items-center ${id===currentChatId?'bg-[#1e1433] border border-purple-800/50':''}`;
    div.innerHTML = `<span class="truncate">${c.title}</span><span class="w-2 h-2 rounded-full ${Math.random()>0.5?'bg-blue-500':''}"></span>`;
    div.onclick=()=>loadChat(id);
    list.appendChild(div);
  });
}

function renderMessages(){
  chat.innerHTML='';
  const msgs = allChats[currentChatId]?.messages||[];
  msgs.forEach(m=>addBubble(m.role, m.content, m.image, m.isBeautified, false));
  chat.scrollTop=chat.scrollHeight;
  if(msgs.length===0){
    addBubble('assistant','Poa! I am LUMORA AI by John Theuri (lenz.itz) - https://lumora-ai-ncmb.onrender.com \n\nTap ☰ to see saved chats like Meta AI! Ask anything - I remember your chats now!', null, false, false);
  }
}

function addBubble(role, text, img=null, isBeautified=false, save=true){
  const wrap = document.createElement('div');
  wrap.className = role==='user' ? 'flex justify-end' : 'flex justify-start';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role==='user'?'user':'bot');
  let html='';
  if(img) html+=`<img src="${img}" class="rounded-xl mb-2 max-w-[240px]">`;
  if(isBeautified) html+=`<div class="text-[10px] text-purple-300 mb-1">✨ Beautified</div>`;
  html+=`<div class="text-sm whitespace-pre-wrap">${text}</div>`;
  if(role==='assistant') html+=`<div class="flex gap-2 mt-2"><button onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.innerText)" class="text-[10px] px-2 py-1 rounded-full bg-[#2a1d4a]">Copy</button><button onclick="speechSynthesis.speak(new SpeechSynthesisUtterance(this.parentElement.previousElementSibling.innerText))" class="text-[10px] px-2 py-1 rounded-full bg-[#2a1d4a]">Speak</button></div>`;
  bubble.innerHTML=html;
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;
  
  if(save && role!=='system'){
    if(!allChats[currentChatId]) allChats[currentChatId]={title:'New Chat',messages:[]};
    if(allChats[currentChatId].messages.length===0 && role==='user'){
      allChats[currentChatId].title = text.slice(0,35) || 'New Chat';
    }
    allChats[currentChatId].messages.push({role, content:text, image:img, isBeautified});
    saveAll();
  }
}

async function beautifyCanvas(dataUrl){
  return new Promise(r=>{
    const img=new Image(); img.onload=()=>{
      const c=document.createElement('canvas'); const max=1024; let w=img.width,h=img.height;
      if(w>max||h>max){const k=Math.min(max/w,max/h); w*=k; h*=k;} c.width=w; c.height=h;
      const ctx=c.getContext('2d'); ctx.filter='brightness(110%) contrast(110%) saturate(130%)'; ctx.drawImage(img,0,0,w,h);
      r(c.toDataURL('image/jpeg',0.9));
    }; img.src=dataUrl;
  });
}

let currentImage=null;
document.getElementById('cameraBtn').onclick=()=>document.getElementById('cameraInput').click();
document.getElementById('galleryBtn').onclick=()=>document.getElementById('galleryInput').click();
document.getElementById('cameraInput').onchange=e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{currentImage=ev.target.result; addBubble('user','📷 Image', currentImage);}; r.readAsDataURL(f);};
document.getElementById('galleryInput').onchange=document.getElementById('cameraInput').onchange;

async function sendMessage(){
  const text=input.value.trim(); if(!text && !currentImage) return;
  const content=text||'Make it beautiful';
  addBubble('user', content, currentImage);
  const imgToSend=currentImage;
  const isBeautify=/beautiful|beautify|enhance/i.test(content);
  input.value=''; currentImage=null;
  const typing=document.createElement('div'); typing.className='flex justify-start'; typing.innerHTML='<div class="bubble bot text-sm">Lumora typing... ✨</div>'; chat.appendChild(typing);
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages: allChats[currentChatId].messages.slice(-10), image: imgToSend})});
    const data=await res.json(); typing.remove();
    addBubble('assistant', data.reply||'Sina reply');
    if(imgToSend && isBeautify){
      const b=await beautifyCanvas(imgToSend);
      addBubble('assistant','Done! ✨ Beautified like ChatGPT!', b, true);
    }
  }catch(e){typing.remove(); addBubble('assistant','Error: '+e.message+' - Check https://lumora-ai-ncmb.onrender.com/api/chat');}
}

document.getElementById('sendBtn').onclick=sendMessage;
input.addEventListener('keydown', e=>{if(e.key==='Enter') sendMessage();});
document.getElementById('micBtn').onclick=()=>{
  const R=window.SpeechRecognition||window.webkitSpeechRecognition; if(!R)return; const r=new R(); r.lang='en-KE'; r.onresult=e=>{input.value=e.results[0][0].transcript; sendMessage();}; r.start();
};

renderMessages();
renderChatsList();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
