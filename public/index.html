<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Axenova AI - By John Theuri</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8a2be2">
<meta name="description" content="Axenova AI - Answers everything except porn, ChatGPT-like, self-search internet, camera, mic, by John Theuri Kiambu">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100vw}
body{background:#0f0f14;color:#fff;font-family:system-ui;display:flex;height:100vh;width:100vw}
.sidebar{width:260px;flex-shrink:0;background:#17171f;border-right:1px solid #222;padding:12px;overflow-y:auto;position:relative}
.main{flex:1;display:flex;flex-direction:column;min-width:0;width:100%}
.header{padding:16px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;min-width:0}
.header h1{background:linear-gradient(90deg,#8a2be2,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px;white-space:nowrap}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;width:100%}
.bubble{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:15px}
.bubble a{word-break:break-all;display:inline-block;max-width:100%}
.user{align-self:flex-end;background:linear-gradient(135deg,#8a2be2,#c751ff)}
.ai{align-self:flex-start;background:#1e1e2a;border:1px solid #2a2a3a}
.inputBar{padding:12px;border-top:1px solid #222;display:flex;gap:8px;align-items:center;width:100%;background:#0f0f14}
.inputBar input{flex:1;background:#1e1e2a;border:1px solid #333;border-radius:24px;padding:12px 18px;color:#fff;outline:none;min-width:0;font-size:15px}
.inputBar button{background:linear-gradient(135deg,#8a2be2,#ff6b9d);border:none;border-radius:50%;width:44px;height:44px;color:#fff;cursor:pointer;font-size:18px;flex-shrink:0}
.iconBtn{background:#1e1e2a!important;border:1px solid #333!important;border-radius:50%!important;width:42px!important;height:42px!important;color:#fff!important;cursor:pointer;flex-shrink:0;font-size:18px}
.speakBtn{background:#2a2a3a;border:none;color:#fff;border-radius:12px;padding:4px 8px;margin-top:8px;cursor:pointer;font-size:12px}
@media (max-width:700px){
.sidebar{display:none;position:fixed;left:0;top:0;bottom:0;z-index:50;height:100vh;box-shadow:0 0 40px #000}
.bubble{max-width:92%}
.chat{padding:12px}
.header{padding:12px}
.header h1{font-size:18px}
.header span{display:none}
}
</style>
</head>
<body>
<div id="sidebarOverlay" onclick="closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:49"></div>
<div class="sidebar" id="sidebar">
<button onclick="closeSidebar()" style="position:absolute;top:10px;right:10px;background:#2a2a3a;border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;z-index:51">✕</button>
<h3>Axenova AI</h3>
<p style="font-size:12px;color:#888;margin:8px 0">By John Theuri lenz.itz<br>Answers everything except porn</p>
<div id="history"></div>
</div>
<div class="main">
<div class="header">
<div style="display:flex;gap:12px;align-items:center;min-width:0">
<button onclick="toggleSidebar()" style="background:none;border:none;color:#fff;font-size:22px;flex-shrink:0">☰</button>
<h1>Axenova AI</h1>
<span style="font-size:12px;color:#888">Answers everything except porn, ChatGPT-like, internet, camera, mic</span>
</div>
<div style="display:flex;gap:6px">
<button class="iconBtn" id="voiceToggleBtn" onclick="toggleVoice()" title="Girl Voice">🔊</button>
<button class="iconBtn" onclick="document.getElementById('fileInput').click()">🖼️</button>
<button class="iconBtn" onclick="startCamera()">📷</button>
</div>
</div>
<div class="chat" id="chat">
<div class="bubble ai">Hey there I'm Axenova, what do you want us to create today? 🚀 I answer everything except pornographic questions!<br><button class="speakBtn" onclick="speakText(this.parentElement.innerText)">🔊 Read aloud</button></div>
</div>
<div class="inputBar">
<input type="file" id="fileInput" accept="image/*" hidden onchange="handleImage(this)">
<button class="iconBtn" onclick="document.getElementById('fileInput').click()" title="Upload">🖼️</button>
<button class="iconBtn" onclick="startCamera()" title="Camera">📷</button>
<button class="iconBtn" onclick="startMic()" title="Mic">🎤</button>
<input id="msg" placeholder="Ask Axenova..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
</div>
<video id="camera" autoplay playsinline style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:99"></video>
<canvas id="canvas" style="display:none"></canvas>
<script>
let historyChats=JSON.parse(localStorage.getItem('axenova_history')||'[]');
let currentImage=null;
let voiceOn=false;
const chatEl=document.getElementById('chat');
const msgEl=document.getElementById('msg');
if(window.innerWidth<700){document.getElementById('sidebar').style.display='none';}
function openSidebar(){document.getElementById('sidebar').style.display='block';document.getElementById('sidebarOverlay').style.display='block';}
function closeSidebar(){if(window.innerWidth<700){document.getElementById('sidebar').style.display='none';document.getElementById('sidebarOverlay').style.display='none';}}
function toggleSidebar(){var s=document.getElementById('sidebar');if(s.style.display==='block'){closeSidebar();}else{openSidebar();}}
function getGirlVoice(){var voices=speechSynthesis.getVoices();return voices.find(v=>/female|zira|samantha|google us english|microsoft zira|natasha|female/i.test(v.name))||voices.find(v=>v.lang&&v.lang.startsWith('en')&&/google|zira|samantha|female/i.test(v.name))||voices.find(v=>v.lang==='en-GB'&&v.name.toLowerCase().includes('female'))||voices.find(v=>v.lang&&v.lang.startsWith('en'))||voices[0];}
function speakText(txt){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();var clean=txt.replace(/🔊 Read aloud/g,'').replace(/<[^>]*>/g,'').slice(0,600);var u=new SpeechSynthesisUtterance(clean);u.rate=1;u.pitch=1.2;u.volume=1;var v=getGirlVoice();if(v)u.voice=v;u.lang=(v&&v.lang)||'en-GB';window.speechSynthesis.speak(u);}
function toggleVoice(){voiceOn=!voiceOn;document.getElementById('voiceToggleBtn').style.background=voiceOn?'#8a2be2':'#1e1e2a';document.getElementById('voiceToggleBtn').textContent=voiceOn?'🔊✅':'🔊';if(voiceOn){speakText('Hi, I am Axenova. Girl voice is on. I will read my messages for you.');}else{window.speechSynthesis.cancel();}}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=function(){};}
function renderHistory(){const h=document.getElementById('history');h.innerHTML=historyChats.slice().reverse().map((c,i)=>`<div style="padding:8px;border-radius:8px;background:#1e1e2a;margin:4px 0;cursor:pointer;font-size:13px" onclick="loadChat(${historyChats.length-1-i})">${c.title.slice(0,30)}</div>`).join('');}
function loadChat(idx){closeSidebar();const c=historyChats[idx];chatEl.innerHTML=c.messages.map(m=>`<div class="bubble ${m.role}">${m.text}${m.role==='ai'?'<br><button class="speakBtn" onclick="speakText(this.parentElement.innerText)">🔊 Read aloud</button>':''}</div>`).join('');}
function saveHistory(){if(historyChats.length>0){localStorage.setItem('axenova_history',JSON.stringify(historyChats));renderHistory();}}
async function send(){const text=msgEl.value.trim();if(!text&&!currentImage)return;chatEl.innerHTML+=`<div class="bubble user">${text}${currentImage?'<br><img src="'+currentImage+'" style="max-width:200px;border-radius:12px;margin-top:8px">':''}</div>`;msgEl.value='';const payload={message:text,image:currentImage,history:historyChats.length>0?historyChats[historyChats.length-1].messages:[]};currentImage=null;chatEl.scrollTop=chatEl.scrollHeight;if(historyChats.length===0||historyChats[historyChats.length-1].messages.length>10){historyChats.push({title:text.slice(0,30),messages:[]});}historyChats[historyChats.length-1].messages.push({role:'user',text:text});try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();let reply=data.reply||data.response||"Hey I'm Axenova!";if(data.image){reply+=`<br><img src="${data.image}" style="max-width:100%;border-radius:12px;margin-top:12px">`;}chatEl.innerHTML+=`<div class="bubble ai">${reply}<br><button class="speakBtn" onclick="speakText(this.parentElement.innerText)">🔊 Read aloud</button></div>`;historyChats[historyChats.length-1].messages.push({role:'ai',text:reply});saveHistory();if(voiceOn)speakText(reply);}catch(e){chatEl.innerHTML+=`<div class="bubble ai">Pole error: ${e.message}. Try again.</div>`;}chatEl.scrollTop=chatEl.scrollHeight;}
function handleImage(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{currentImage=e.target.result;chatEl.innerHTML+=`<div class="bubble user"><img src="${currentImage}" style="max-width:200px;border-radius:12px"><br>Image ready - what to do?</div>`;chatEl.scrollTop=chatEl.scrollHeight;};reader.readAsDataURL(file);}
async function startCamera(){try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const video=document.getElementById('camera');video.srcObject=stream;video.style.display='block';video.onclick=()=>{const canvas=document.getElementById('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);currentImage=canvas.toDataURL('image/jpeg');stream.getTracks().forEach(t=>t.stop());video.style.display='none';chatEl.innerHTML+=`<div class="bubble user"><img src="${currentImage}" style="max-width:200px;border-radius:12px"><br>Photo captured!</div>`;chatEl.scrollTop=chatEl.scrollHeight;};}catch(e){alert('Camera error:'+e.message);}}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Mic not supported');return;}const rec=new SR();rec.lang='en-KE';rec.onresult=e=>{msgEl.value=e.results[0][0].transcript;};rec.start();}
renderHistory();
</script>
</body>
</html>
