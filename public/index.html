
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="description" content="Axenova AI - Your intelligent assistant">
<title>Axenova AI</title>

<!-- Modern icons and Markdown renderer -->
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
  --bg:#08090b;
  --panel:#101214;
  --panel2:#171a1d;
  --border:#25292d;
  --text:#eceeef;
  --muted:#92999e;
  --green:#10b981;
  --green2:#059669;
  --user:#202428;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--green);
  outline-offset:2px;
}

.app{
  display:flex;
  width:100%;
  height:100dvh;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:275px;
  flex-shrink:0;
  background:#0d0f11;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:16px 12px;
  transition:transform .25s ease,width .25s ease;
  z-index:30;
}

.sidebar-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 5px 20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:17px;
  font-weight:750;
  letter-spacing:-.5px;
}

.brand-dot{
  width:8px;
  height:8px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 12px #10b98199;
}

.icon-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:transparent;
  display:grid;
  place-items:center;
  color:#aeb5b9;
  transition:.2s;
}

.icon-btn:hover{background:#202428;color:white}
.icon-btn svg{width:19px;height:19px}

.new-chat{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  font-size:14px;
  margin-bottom:24px;
  transition:.2s;
}

.new-chat:hover{background:var(--panel2);border-color:#3b4247}
.new-chat svg{width:18px;height:18px}

.sidebar-label{
  color:#777f84;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  padding:0 10px 10px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  width:100%;
  border:0;
  background:transparent;
  color:#b9c0c4;
  padding:11px 10px;
  border-radius:9px;
  text-align:left;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:3px;
}

.history-item:hover,.history-item.active{
  background:#1b1f22;
  color:white;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:12px;
}

.profile-button{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px;
  background:transparent;
  border:0;
  border-radius:10px;
  text-align:left;
}

.profile-button:hover{background:#1b1f22}

.avatar{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#173b31;
  color:#43d6a7;
  font-weight:700;
  flex-shrink:0;
}

.profile-info{min-width:0;flex:1}
.profile-name{font-size:13px;font-weight:650}
.profile-status{font-size:11px;color:var(--muted);margin-top:3px}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(ellipse at 70% 0%,#073b2812,transparent 42%),
    var(--bg);
}

.topbar{
  height:64px;
  flex-shrink:0;
  border-bottom:1px solid #ffffff0c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:#08090bf0;
  z-index:5;
}

.top-left{display:flex;align-items:center;gap:13px}
.mobile-brand{display:none}

.top-title{
  font-size:14px;
  font-weight:700;
}

.top-subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.account-btn{
  border:1px solid var(--border);
  background:#111416;
  border-radius:20px;
  padding:9px 15px;
  font-size:12px;
  font-weight:600;
}

.account-btn:hover{background:#202428}

/* CHAT AREA */

.chat-area{
  flex:1;
  overflow-y:auto;
  scroll-behavior:smooth;
  padding:30px 20px 25px;
}

.chat-content{
  max-width:790px;
  width:100%;
  margin:0 auto;
}

.welcome{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 0 70px;
  text-align:center;
}

.welcome-logo{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border:1px solid #17684f;
  background:#0d211a;
  border-radius:19px;
  color:#31d6a0;
  margin-bottom:22px;
}

.welcome-logo svg{width:29px;height:29px}

.welcome h1{
  font-size:29px;
  font-weight:700;
  letter-spacing:-1px;
  margin-bottom:10px;
}

.welcome p{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
  max-width:420px;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  width:100%;
  max-width:560px;
  margin-top:32px;
}

.suggestion{
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  padding:15px;
  border:1px solid var(--border);
  background:#101315;
  border-radius:13px;
  color:#c8ced1;
  font-size:12px;
  line-height:1.4;
  min-height:65px;
}

.suggestion:hover{
  background:#171c1d;
  border-color:#27634f;
}

.suggestion svg{
  color:#42c99c;
  width:19px;
  height:19px;
  flex-shrink:0;
}

/* MESSAGES */

.message{
  display:flex;
  gap:15px;
  margin:0 auto 30px;
  max-width:790px;
  width:100%;
  align-items:flex-start;
}

.message-avatar{
  width:32px;
  height:32px;
  flex-shrink:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:750;
}

.user-avatar{background:#292e32;color:#e3e8e9}
.ai-avatar{background:#0b3328;color:#36d6a0}

.message-body{flex:1;min-width:0;padding-top:3px}

.message-name{
  font-size:12px;
  font-weight:700;
  margin-bottom:9px;
  color:#aeb7b9;
}

.message-text{
  font-size:15px;
  line-height:1.8;
  overflow-wrap:anywhere;
  color:#e5e8e9;
}

.message-text p{margin:0 0 13px}
.message-text h1,.message-text h2,.message-text h3{
  line-height:1.4;
  margin:20px 0 10px;
  color:white;
}
.message-text h1{font-size:22px}
.message-text h2{font-size:19px}
.message-text h3{font-size:16px}
.message-text ul,.message-text ol{padding-left:23px;margin:10px 0 16px}
.message-text li{margin:5px 0}
.message-text a{color:#51d6ac}
.message-text blockquote{
  border-left:3px solid var(--green);
  padding-left:13px;
  color:#b9c3c2;
  margin:12px 0;
}
.message-text table{
  border-collapse:collapse;
  display:block;
  overflow-x:auto;
  max-width:100%;
  margin:14px 0;
}
.message-text th,.message-text td{
  border:1px solid #343a3e;
  padding:8px 11px;
  text-align:left;
  font-size:13px;
}
.message-text th{background:#171c1e}
.message-text code{
  background:#202629;
  padding:2px 5px;
  border-radius:5px;
  font-size:.9em;
}
.message-text pre{
  background:#111518;
  border:1px solid #2a3034;
  padding:15px;
  border-radius:12px;
  overflow-x:auto;
  margin:13px 0;
}
.message-text pre code{
  background:transparent;
  padding:0;
  font-size:13px;
  line-height:1.6;
}

.message-image{
  max-width:100%;
  max-height:350px;
  border-radius:13px;
  margin-top:10px;
  border:1px solid var(--border);
}

.message-actions{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.message-actions button{
  display:flex;
  align-items:center;
  gap:6px;
  background:transparent;
  border:0;
  color:#858e93;
  padding:6px 8px;
  border-radius:7px;
  font-size:11px;
}

.message-actions button:hover{background:#1b2023;color:white}
.message-actions svg{width:14px;height:14px}

.typing{
  display:flex;
  gap:5px;
  padding:7px 0;
}
.typing span{
  width:6px;height:6px;
  border-radius:50%;
  background:#4ccba1;
  animation:pulse 1s infinite alternate;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes pulse{to{opacity:.25;transform:translateY(-4px)}}

/* COMPOSER */

.composer-wrap{
  flex-shrink:0;
  padding:12px 20px 8px;
  background:linear-gradient(transparent,#08090b 15%);
}

.composer{
  width:100%;
  max-width:790px;
  margin:0 auto;
  background:#151819;
  border:1px solid #303638;
  border-radius:23px;
  padding:13px 14px 10px;
  box-shadow:0 8px 35px #0005;
  transition:border-color .2s;
}

.composer:focus-within{border-color:#28765b}

#messageInput{
  display:block;
  width:100%;
  min-height:35px;
  max-height:160px;
  resize:none;
  border:0;
  outline:0;
  color:white;
  background:transparent;
  padding:5px 5px 10px;
  font-size:15px;
  line-height:1.5;
}

#messageInput::placeholder{color:#828b8f}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.tools{
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
}

.tool-btn{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  background:transparent;
  border:0;
  color:#aeb6b8;
  border-radius:50%;
  transition:.2s;
  flex-shrink:0;
}

.tool-btn:hover{background:#292f32;color:white}
.tool-btn.active{background:#103b2e;color:#45d7a7}
.tool-btn svg{width:18px;height:18px}

.send-btn{
  width:39px;
  height:39px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  background:var(--green);
  color:#04150f;
  border:0;
  border-radius:13px;
  transition:.2s;
}

.send-btn:hover{background:#34d399;transform:translateY(-1px)}
.send-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.send-btn svg{width:19px;height:19px}

.mode-label{
  max-width:790px;
  width:100%;
  margin:0 auto 7px;
  padding-left:5px;
  color:#54cba2;
  font-size:11px;
  min-height:14px;
}

.disclaimer{
  text-align:center;
  color:#60696d;
  font-size:10px;
  padding:8px 5px 0;
}

.file-preview{
  display:none;
  align-items:center;
  gap:9px;
  padding:8px;
  margin:3px 0 8px;
  border-radius:10px;
  background:#202629;
  font-size:12px;
  color:#cbd2d4;
}

.file-preview img{
  width:40px;height:40px;
  object-fit:cover;
  border-radius:7px;
}

.file-preview button{
  margin-left:auto;
  border:0;
  background:transparent;
  color:#aaa;
}

/* MOBILE */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:20;
}

@media(max-width:700px){
  .sidebar{
    position:fixed;
    top:0;bottom:0;left:0;
    width:285px;
    transform:translateX(-100%);
    box-shadow:15px 0 50px #0008;
  }
  .sidebar.open{transform:translateX(0)}
  .overlay.show{display:block}
  .topbar{height:59px;padding:0 14px}
  .mobile-brand{display:flex;align-items:center;gap:9px}
  .mobile-brand .brand{font-size:15px}
  .top-title,.top-subtitle{display:none}
  .chat-area{padding:22px 14px 18px}
  .message{gap:10px;margin-bottom:25px}
  .message-avatar{width:30px;height:30px}
  .message-text{font-size:14px;line-height:1.75}
  .welcome h1{font-size:24px}
  .welcome p{font-size:13px}
  .suggestions{grid-template-columns:1fr;max-width:390px;margin-top:25px}
  .suggestion{min-height:54px;padding:12px}
  .composer-wrap{padding:8px 10px 5px}
  .composer{border-radius:21px;padding:11px 10px 9px}
  #messageInput{font-size:14px}
  .tool-btn{width:34px;height:34px}
  .tool-btn svg{width:17px;height:17px}
  .send-btn{width:39px;height:39px}
  .disclaimer{font-size:9px}
}

@media(max-width:370px){
  .tools{gap:0}
  .tool-btn{width:31px;height:32px}
  .account-btn{padding:8px 11px}
}

/* ACCOUNT DIALOG */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{display:flex}

.modal-card{
  width:100%;
  max-width:390px;
  background:#111517;
  border:1px solid #30383a;
  border-radius:20px;
  padding:24px;
  box-shadow:0 20px 80px #0009;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-head h2{font-size:19px}
.modal-card label{
  display:block;
  color:#aab2b5;
  font-size:12px;
  margin:13px 0 7px;
}

.modal-card input{
  width:100%;
  padding:12px;
  border-radius:10px;
  background:#080b0c;
  border:1px solid #30383a;
  color:white;
  outline:none;
}

.modal-submit{
  width:100%;
  margin-top:19px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:var(--green);
  color:#04150f;
  font-weight:750;
}

.modal-switch{
  margin-top:15px;
  color:#aab2b5;
  text-align:center;
  font-size:12px;
}

.modal-switch button{
  background:none;border:0;color:#4bd5a5;
}

#toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  background:#202729;
  border:1px solid #3a4447;
  color:white;
  border-radius:10px;
  padding:10px 15px;
  font-size:12px;
  display:none;
  z-index:100;
  max-width:90%;
  text-align:center;
}
</style>
</head>

<body>
<div class="app">

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span>Axenova AI</span>
        <span class="brand-dot"></span>
      </div>
      <button class="icon-btn" onclick="toggleSidebar()" aria-label="Close menu">
        <i data-lucide="panel-left-close"></i>
      </button>
    </div>

    <button class="new-chat" onclick="newChat()">
      <i data-lucide="plus"></i>
      <span>New chat</span>
    </button>

    <div class="sidebar-label">YOUR CHATS</div>
    <div class="history" id="historyList"></div>

    <div class="sidebar-bottom">
      <button class="profile-button" onclick="openAccount()">
        <div class="avatar" id="profileAvatar">A</div>
        <div class="profile-info">
          <div class="profile-name" id="profileName">Guest</div>
          <div class="profile-status" id="profileStatus">Sign in to your account</div>
        </div>
        <i data-lucide="settings" style="width:17px;color:#8e989c"></i>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn" onclick="toggleSidebar()" aria-label="Open menu">
          <i data-lucide="menu"></i>
        </button>

        <div class="mobile-brand">
          <div class="brand">
            <span>Axenova AI</span>
            <span class="brand-dot"></span>
          </div>
        </div>

        <div>
          <div class="top-title">Axenova AI</div>
          <div class="top-subtitle">Your intelligent assistant</div>
        </div>
      </div>

      <button class="account-btn" onclick="openAccount()">Account</button>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="chat-content" id="chatContent">
        <div class="welcome" id="welcome">
          <div class="welcome-logo"><i data-lucide="sparkles"></i></div>
          <h1>How can I help you?</h1>
          <p>Ask anything, explore ideas, write code, search the web or create images.</p>

          <div class="suggestions">
            <button class="suggestion" onclick="useSuggestion('Help me build a modern website')">
              <i data-lucide="code-2"></i>
              <span>Build a modern website</span>
            </button>
            <button class="suggestion" onclick="useSuggestion('Explain a difficult topic in simple terms')">
              <i data-lucide="book-open"></i>
              <span>Learn something new</span>
            </button>
            <button class="suggestion" onclick="useSuggestion('Give me five creative business ideas')">
              <i data-lucide="lightbulb"></i>
              <span>Explore business ideas</span>
            </button>
            <button class="suggestion" onclick="useSuggestion('Help me write a professional CV')">
              <i data-lucide="file-text"></i>
              <span>Write something</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <div class="mode-label" id="modeLabel"></div>

      <div class="composer">
        <div class="file-preview" id="filePreview">
          <img id="previewImage" alt="Selected image">
          <span id="fileName">Image selected</span>
          <button onclick="removeFile()" aria-label="Remove image">
            <i data-lucide="x"></i>
          </button>
        </div>

        <textarea id="messageInput" rows="1" placeholder="Message Axenova AI..." aria-label="Message"></textarea>

        <div class="composer-bottom">
          <div class="tools">
            <button class="tool-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">
              <i data-lucide="plus"></i>
            </button>

            <button class="tool-btn" id="cameraBtn" onclick="document.getElementById('cameraInput').click()" title="Take a photo">
              <i data-lucide="camera"></i>
            </button>

            <button class="tool-btn" id="imageBtn" onclick="setMode('image')" title="Create image">
              <i data-lucide="image"></i>
            </button>

            <button class="tool-btn" id="searchBtn" onclick="setMode('search')" title="Web search">
              <i data-lucide="globe"></i>
            </button>

            <button class="tool-btn" id="codeBtn" onclick="setMode('code')" title="Coding mode">
              <i data-lucide="code"></i>
            </button>

            <button class="tool-btn" id="voiceBtn" onclick="startVoice()" title="Voice input">
              <i data-lucide="mic"></i>
            </button>
          </div>

          <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send message">
            <i data-lucide="arrow-up"></i>
          </button>
        </div>
      </div>

      <div class="disclaimer">Axenova AI can make mistakes. Verify important information.</div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" accept="image/*" hidden onchange="handleFile(this)">
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden onchange="handleFile(this)">

<!-- ACCOUNT MODAL -->
<div class="modal" id="accountModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Your account</h2>
      <button class="icon-btn" onclick="closeAccount()">
        <i data-lucide="x"></i>
      </button>
    </div>

    <form id="accountForm">
      <label for="email">Email address</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button class="modal-submit" id="accountSubmit" type="submit">Sign in</button>
    </form>

    <div class="modal-switch">
      <span id="switchText">Don't have an account?</span>
      <button onclick="switchAccountMode()" id="switchButton">Create account</button>
    </div>

    <div class="modal-switch">
      <button onclick="logout()" id="logoutButton" style="display:none">Sign out</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================
   AXENOVA AI CONFIGURATION
========================= */

const API = "";
let currentMode = "chat";
let selectedImage = null;
let isSending = false;
let accountMode = "login";
let currentUser = null;
let conversationId = null;
let conversationHistory = [];

const chatContent = document.getElementById("chatContent");
const chatArea = document.getElementById("chatArea");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

function icons(){
  if(window.lucide) lucide.createIcons();
}
icons();

/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

/* =========================
   NOTIFICATIONS
========================= */

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.style.display="block";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.style.display="none",3000);
}

/* =========================
   CHAT MANAGEMENT
========================= */

function newChat(){
  conversationId=null;
  conversationHistory=[];
  chatContent.innerHTML="";
  showWelcome();
  renderHistory();
  closeSidebar();
  messageInput.focus();
}

function showWelcome(){
  chatContent.innerHTML=`
    <div class="welcome" id="welcome">
      <div class="welcome-logo"><i data-lucide="sparkles"></i></div>
      <h1>How can I help you?</h1>
      <p>Ask anything, explore ideas, write code, search the web or create images.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Help me build a modern website')"><i data-lucide="code-2"></i><span>Build a modern website</span></button>
        <button class="suggestion" onclick="useSuggestion('Explain a difficult topic in simple terms')"><i data-lucide="book-open"></i><span>Learn something new</span></button>
        <button class="suggestion" onclick="useSuggestion('Give me five creative business ideas')"><i data-lucide="lightbulb"></i><span>Explore business ideas</span></button>
        <button class="suggestion" onclick="useSuggestion('Help me write a professional CV')"><i data-lucide="file-text"></i><span>Write something</span></button>
      </div>
    </div>`;
  icons();
}

function useSuggestion(text){
  messageInput.value=text;
  autoResize();
  sendMessage();
}

function renderHistory(){
  const list=document.getElementById("historyList");
  const saved=JSON.parse(localStorage.getItem("axenova_chats")||"[]");
  list.innerHTML="";

  saved.forEach(item=>{
    const btn=document.createElement("button");
    btn.className="history-item";
    btn.textContent=item.title;
    btn.onclick=()=>loadLocalChat(item.id);
    list.appendChild(btn);
  });
}

function saveLocalChat(){
  if(!conversationId) conversationId="chat_"+Date.now();

  const saved=JSON.parse(localStorage.getItem("axenova_chats")||"[]");
  const title=conversationHistory.find(x=>x.role==="user")?.content || "New conversation";

  const existing=saved.findIndex(x=>x.id===conversationId);
  const item={
    id:conversationId,
    title:title.slice(0,55),
    messages:conversationHistory
  };

  if(existing>=0) saved[existing]=item;
  else saved.unshift(item);

  localStorage.setItem("axenova_chats",JSON.stringify(saved.slice(0,40)));
  renderHistory();
}

function loadLocalChat(id){
  const saved=JSON.parse(localStorage.getItem("axenova_chats")||"[]");
  const item=saved.find(x=>x.id===id);
  if(!item)return;

  conversationId=item.id;
  conversationHistory=item.messages||[];
  chatContent.innerHTML="";

  conversationHistory.forEach(m=>{
    addMessage(m.role==="user"?"user":"ai",m.content);
  });

  closeSidebar();
  scrollBottom();
}

/* =========================
   MODE BUTTONS
========================= */

function setMode(mode){
  currentMode=currentMode===mode?"chat":mode;

  document.querySelectorAll(".tool-btn").forEach(b=>b.classList.remove("active"));

  const labels={
    chat:"",
    image:"Image generation mode",
    search:"Web search mode",
    code:"Coding assistant mode"
  };

  const ids={image:"imageBtn",search:"searchBtn",code:"codeBtn"};
  if(ids[currentMode]) document.getElementById(ids[currentMode]).classList.add("active");

  document.getElementById("modeLabel").textContent=labels[currentMode]||"";

  const placeholders={
    chat:"Message Axenova AI...",
    image:"Describe the image you want to create...",
    search:"What should Axenova search for?",
    code:"Describe the code you want help with..."
  };

  messageInput.placeholder=placeholders[currentMode];
  messageInput.focus();
}

/* =========================
   FILE UPLOAD
========================= */

function handleFile(input){
  const file=input.files && input.files[0];
  if(!file)return;

  if(!file.type.startsWith("image/")){
    toast("Please select an image.");
    input.value="";
    return;
  }

  if(file.size>10*1024*1024){
    toast("Image must be smaller than 10 MB.");
    input.value="";
    return;
  }

  const reader=new FileReader();
  reader.onload=()=>{
    selectedImage=reader.result;
    document.getElementById("previewImage").src=selectedImage;
    document.getElementById("fileName").textContent=file.name;
    document.getElementById("filePreview").style.display="flex";
    icons();
  };
  reader.readAsDataURL(file);
}

function removeFile(){
  selectedImage=null;
  document.getElementById("filePreview").style.display="none";
  document.getElementById("fileInput").value="";
  document.getElementById("cameraInput").value="";
}

/* =========================
   MESSAGE DISPLAY
========================= */

function markdown(text){
  if(!window.marked)return escapeHTML(text);
  const raw=marked.parse(text||"");
  return window.DOMPurify?DOMPurify.sanitize(raw):raw;
}

function escapeHTML(text){
  return String(text).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function addMessage(type,text,image=null){
  const row=document.createElement("div");
  row.className="message";

  const avatar=document.createElement("div");
  avatar.className="message-avatar "+(type==="user"?"user-avatar":"ai-avatar");
  avatar.textContent=type==="user"?"U":"A";

  const body=document.createElement("div");
  body.className="message-body";

  const name=document.createElement("div");
  name.className="message-name";
  name.textContent=type==="user"?"You":"Axenova AI";

  const content=document.createElement("div");
  content.className="message-text";
  content.innerHTML=markdown(text);

  body.appendChild(name);
  body.appendChild(content);

  if(image){
    const img=document.createElement("img");
    img.className="message-image";
    img.src=image;
    img.alt="Uploaded image";
    body.appendChild(img);
  }

  if(type==="ai"){
    const actions=document.createElement("div");
    actions.className="message-actions";

    const copy=document.createElement("button");
    copy.innerHTML='<i data-lucide="copy"></i> Copy';
    copy.onclick=()=>copyText(text);

    const read=document.createElement("button");
    read.innerHTML='<i data-lucide="volume-2"></i> Read aloud';
    read.onclick=()=>readAloud(text);

    actions.append(copy,read);
    body.appendChild(actions);
  }

  row.append(avatar,body);
  chatContent.appendChild(row);
  icons();
  scrollBottom();
}

function showTyping(){
  const row=document.createElement("div");
  row.className="message";
  row.id="typingIndicator";
  row.innerHTML=`
    <div class="message-avatar ai-avatar">A</div>
    <div class="message-body">
      <div class="message-name">Axenova AI</div>
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  chatContent.appendChild(row);
  scrollBottom();
}

function removeTyping(){
  document.getElementById("typingIndicator")?.remove();
}

function scrollBottom(){
  setTimeout(()=>chatArea.scrollTop=chatArea.scrollHeight,50);
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    toast("Copied to clipboard");
  }catch(e){
    toast("Could not copy text");
  }
}

function readAloud(text){
  if(!("speechSynthesis" in window)){
    toast("Read aloud is not supported on this browser.");
    return;
  }
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.rate=1;
  speechSynthesis.speak(utterance);
}

/* =========================
   SEND CHAT MESSAGE
========================= */

async function sendMessage(){
  if(isSending)return;

  let message=messageInput.value.trim();
  if(!message && !selectedImage)return;

  if(currentMode==="image" && !message){
    toast("Describe the image you want.");
    return;
  }

  if(currentMode==="image"){
    await generateImage(message);
    return;
  }

  if(currentMode==="search"){
    message="Search the web for the following and give me an accurate answer with sources: "+message;
  }

  if(currentMode==="code"){
    message="Act as an expert software developer. Help me with this coding request, provide clear explanations and working code where appropriate: "+message;
  }

  const imageForMessage=selectedImage;
  const visibleMessage=messageInput.value.trim();

  messageInput.value="";
  autoResize();
  removeFile();

  document.getElementById("welcome")?.remove();

  addMessage("user",visibleMessage||"Please analyse this image.",imageForMessage);
  conversationHistory.push({role:"user",content:visibleMessage||"Please analyse this image."});

  isSending=true;
  sendBtn.disabled=true;
  showTyping();

  try{
    const response=await fetch(API+"/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"include",
      body:JSON.stringify({
        message:message,
        image:imageForMessage,
        history:conversationHistory.slice(-12)
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||data.message||"Request failed. Check your server.");
    }

    const reply=data.reply||data.response||data.content||data.answer||
      data.choices?.[0]?.message?.content;

    if(!reply || !String(reply).trim()){
      throw new Error("The AI returned an empty response. Check the model configuration in server.js.");
    }

    removeTyping();
    addMessage("ai",String(reply));
    conversationHistory.push({role:"assistant",content:String(reply)});
    saveLocalChat();

  }catch(error){
    removeTyping();
    const errorText="Sorry, I couldn't complete that request. "+error.message;
    addMessage("ai",errorText);
    toast("Message failed");
  }finally{
    isSending=false;
    sendBtn.disabled=false;
    messageInput.focus();
  }
}

/* =========================
   IMAGE GENERATION
========================= */

async function generateImage(prompt){
  if(isSending)return;

  messageInput.value="";
  autoResize();

  document.getElementById("welcome")?.remove();
  addMessage("user","Create an image: "+prompt);

  isSending=true;
  sendBtn.disabled=true;
  showTyping();

  try{
    const response=await fetch(API+"/api/image",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"include",
      body:JSON.stringify({prompt})
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||data.message||"Image generation failed.");
    }

    removeTyping();

    const imageUrl=data.image||data.url||data.imageUrl||
      data.data?.[0]?.url;

    if(!imageUrl){
      throw new Error("No image was returned by the image service.");
    }

    addMessage("ai","Your image is ready.");
    const lastMessage=chatContent.lastElementChild;
    const img=document.createElement("img");
    img.className="message-image";
    img.src=imageUrl;
    img.alt="AI generated image";
    lastMessage.querySelector(".message-body").appendChild(img);

    saveLocalChat();

  }catch(error){
    removeTyping();
    addMessage("ai","Image generation failed: "+error.message);
    toast("Image generation failed");
  }finally{
    isSending=false;
    sendBtn.disabled=false;
    setMode("chat");
  }
}

/* =========================
   VOICE INPUT
========================= */

function startVoice(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    toast("Voice input is not supported in this browser.");
    return;
  }

  const recognition=new SpeechRecognition();
  recognition.lang="en-US";
  recognition.interimResults=false;
  recognition.maxAlternatives=1;

  const btn=document.getElementById("voiceBtn");
  btn.classList.add("active");
  toast("Listening... speak now");

  recognition.onresult=(event)=>{
    messageInput.value+=(messageInput.value?" ":"")+event.results[0][0].transcript;
    autoResize();
  };

  recognition.onerror=()=>{
    toast("Voice input failed. Try again.");
  };

  recognition.onend=()=>btn.classList.remove("active");
  recognition.start();
}

/* =========================
   TEXT AREA
========================= */

function autoResize(){
  messageInput.style.height="auto";
  messageInput.style.height=Math.min(messageInput.scrollHeight,160)+"px";
}

messageInput.addEventListener("input",autoResize);

messageInput.addEventListener("keydown",event=>{
  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

/* =========================
   ACCOUNT
========================= */

function openAccount(){
  document.getElementById("accountModal").classList.add("show");
  document.getElementById("logoutButton").style.display=currentUser?"inline":"none";
  icons();
}

function closeAccount(){
  document.getElementById("accountModal").classList.remove("show");
}

function switchAccountMode(){
  accountMode=accountMode==="login"?"register":"login";

  document.getElementById("modalTitle").textContent=
    accountMode==="login"?"Sign in":"Create your account";

  document.getElementById("accountSubmit").textContent=
    accountMode==="login"?"Sign in":"Create account";

  document.getElementById("switchText").textContent=
    accountMode==="login"?"Don't have an account?":"Already have an account?";

  document.getElementById("switchButton").textContent=
    accountMode==="login"?"Create account":"Sign in";
}

document.getElementById("accountForm").addEventListener("submit",async event=>{
  event.preventDefault();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  try{
    const response=await fetch(API+"/api/auth/"+accountMode,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"include",
      body:JSON.stringify({email,password})
    });

    const data=await response.json();

    if(!response.ok)throw new Error(data.error||data.message||"Account request failed.");

    currentUser=data.user||data;
    updateProfile();
    closeAccount();
    toast(accountMode==="login"?"Signed in successfully":"Account created successfully");

  }catch(error){
    toast(error.message);
  }
});

function updateProfile(){
  const email=currentUser?.email||currentUser?.user?.email||"User";
  const display=email.split("@")[0];

  document.getElementById("profileName").textContent=display;
  document.getElementById("profileStatus").textContent="Signed in";
  document.getElementById("profileAvatar").textContent=display.charAt(0).toUpperCase();
  document.getElementById("logoutButton").style.display="inline";
}

async function checkAccount(){
  try{
    const response=await fetch(API+"/api/auth/me",{
      credentials:"include"
    });

    if(!response.ok)return;

    const data=await response.json();
    if(data.user||data.email){
      currentUser=data.user||data;
      updateProfile();
    }
  }catch(error){
    console.log("Account check unavailable");
  }
}

async function logout(){
  try{
    await fetch(API+"/api/auth/logout",{
      method:"POST",
      credentials:"include"
    });
  }catch(error){}

  currentUser=null;
  document.getElementById("profileName").textContent="Guest";
  document.getElementById("profileStatus").textContent="Sign in to your account";
  document.getElementById("profileAvatar").textContent="A";
  document.getElementById("logoutButton").style.display="none";
  closeAccount();
  toast("Signed out");
}

/* =========================
   STARTUP
========================= */

renderHistory();
checkAccount();
icons();
messageInput.focus();
</script>
</body>
</html>
