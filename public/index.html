<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Axenova AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0a1a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #2a2140;background:#140e24;position:sticky;top:0;z-index:10}
header .logo{font-size:20px;font-weight:800}
header .sub{font-size:12px;color:#b8aee0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .spacer{flex:1}
.iconbtn{background:#241a3d;border:1px solid #372a5c;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;background:#170f2b;border-right:1px solid #2a2140;padding:16px;transform:translateX(-100%);transition:.25s;z-index:50;overflow:auto}
#sidebar.open{transform:none}
#sidebar h3{font-size:14px;color:#b8aee0;margin-bottom:10px}
#sidebar button{width:100%;text-align:left;background:#241a3d;border:1px solid #372a5c;color:#fff;padding:10px;border-radius:10px;margin-bottom:8px;cursor:pointer}
#chat{flex:1;overflow:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;padding:13px 14px;border-radius:16px;line-height:1.55;font-size:15px;white-space:normal;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#d946a8,#8b5cf6);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:#221838;border:1px solid #32245a;border-bottom-left-radius:6px;width:92%}
.msg.bot p{margin:6px 0}
.msg.bot ul{margin:6px 0 6px 18px}
.msg.bot a{color:#c084fc;word-break:break-all}
.msg.bot code{background:#0006;padding:2px 5px;border-radius:5px}
.msg.bot pre{background:#0006;padding:10px;border-radius:10px;overflow:auto;white-space:pre-wrap}
.msg.bot b,.msg.bot strong{color:#fff}
.sources{margin-top:12px;border-top:1px solid #372a5c;padding-top:8px;font-size:13px}
.sources b{color:#e9d5ff}
.sources a{display:block;color:#c084fc;text-decoration:none;margin-top:6px}
.copybtn{margin-top:8px;background:transparent;border:1px solid #372a5c;color:#b8aee0;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer}
.thinking{color:#b8aee0;font-size:14px}
#composer{padding:10px 12px 14px;background:#140e24;border-top:1px solid #2a2140}
#inputBox{display:flex;gap:8px;align-items:flex-end;background:#221838;border:1px solid #372a5c;border-radius:18px;padding:8px 8px 8px 12px}
#msgInput{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:15px;resize:none;max-height:120px;font-family:inherit}
#msgInput::placeholder{color:#8b7fb8}
.roundbtn{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
#sendBtn{background:linear-gradient(135deg,#d946a8,#8b5cf6);color:#fff}
#micBtn.recording{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
#preview{display:none;margin-bottom:8px;position:relative;width:110px}
#preview img{width:110px;border-radius:12px}
#preview span{position:absolute;top:-6px;right:-6px;background:#ef4444;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
input[type=file]{display:none}
img.gen{max-width:100%;border-radius:14px;margin-top:8px}
</style>
</head>
<body>

<div id="sidebar">
  <h3>Pages / History</h3>
  <button onclick="newChat()">+ New Chat</button>
  <div id="historyList"></div>
  <br><button onclick="toggleSidebar()">Close</button>
</div>

<header>
  <button class="iconbtn" onclick="toggleSidebar()">☰</button>
  <div>
    <div class="logo">Lumora AI</div>
    <div class="sub">ChatGPT-like with self-search, camera, mic</div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" onclick="document.getElementById('imgInput').click()">🖼️</button>
  <button class="iconbtn" onclick="document.getElementById('camInput').click()">📷</button>
</header>

<div id="chat"></div>

<div id="composer">
  <div id="preview"><img id="previewImg"><span onclick="clearImage()">×</span></div>
  <div id="inputBox">
    <button class="roundbtn" style="background:#241a3d;color:#fff" onclick="document.getElementById('imgInput').click()">🖼️</button>
    <button class="roundbtn" style="background:#241a3d;color:#fff" onclick="document.getElementById('camInput').click()">📷</button>
    <textarea id="msgInput" rows="1" placeholder="Ask Lumora...  (e.g., Create two students coming from school, From when is China Square, Edit this photo)"></textarea>
    <button class="roundbtn" id="micBtn" style="background:#241a3d;color:#fff" onclick="toggleMic()">🎤</button>
    <button class="roundbtn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<input type="file" id="imgInput" accept="image/*" onchange="handleImage(this)">
<input type="file" id="camInput" accept="image/*" capture="environment" onchange="handleImage(this)">

<script>
let history = JSON.parse(localStorage.getItem('lumora_history')||'[]');
let currentImage = null;
let recognizing = false;
let recognition = null;
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); renderHistory(); }
function newChat(){ chatEl.innerHTML=''; history=[]; localStorage.removeItem('lumora_history'); renderHistory(); addBot("Habari, mimi ni Lumora AI. Niulize chochote, kuhusu KCSE, news, bei, picha, chochote."); }

function renderHistory(){
  const list = document.getElementById('historyList');
  list.innerHTML = history.slice(-20).reverse().map((h,i)=>`<button onclick="loadHistory(${history.length-1-i})">${escapeHtml(h.slice(0,45))}...</button>`).join('') || '<p style="color:#8b7fb8;font-size:13px">No chats yet</p>';
}
function loadHistory(i){ toggleSidebar(); }

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// MARKDOWN RENDERER - hii ndio inaondoa **
function renderMarkdown(text){
  let t = escapeHtml(text);
  t = t.replace(/```([\s\S]*?)```/g, (m,c)=>'<pre>'+c+'</pre>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/__([^_]+)__/g, '<b>$1</b>');
  t = t.replace(/^### (.*)$/gm, '<p><b>$1</b></p>');
  t = t.replace(/^## (.*)$/gm, '<p><b>$1</b></p>');
  t = t.replace(/^# (.*)$/gm, '<p><b>$1</b></p>');
  t = t.replace(/^\s*[-*] (.*)$/gm, '<li>$1</li>');
  t = t.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  t = t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  t = t.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
  return '<p>'+t+'</p>';
}

function addUser(text){
  const d=document.createElement('div'); d.className='msg user'; d.textContent=text; chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight;
}
function addBot(text, sources){
  const d=document.createElement('div'); d.className='msg bot';
  d.innerHTML = renderMarkdown(text);
  if(sources && sources.length){
    let s='<div class="sources"><b>🔍 Sources</b>';
    sources.forEach(src=>{ s+=`<a href="${src.link}" target="_blank">• ${escapeHtml(src.title||src.link)}</a>`; });
    s+='</div>';
    d.innerHTML += s;
  }
  d.innerHTML += `<br><button class="copybtn" onclick="navigator.clipboard.writeText(this.parentElement.innerText);this.textContent='Copied ✓'">📋 Copy</button>`;
  chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight;
  return d;
}

function handleImage(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ currentImage=e.target.result; document.getElementById('previewImg').src=currentImage; document.getElementById('preview').style.display='block'; };
  r.readAsDataURL(f);
}
function clearImage(){ currentImage=null; document.getElementById('preview').style.display='none'; }

function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Mic hai-supported kwa hii browser. Jaribu Chrome.'); return; }
  if(recognizing){ recognition.stop(); return; }
  recognition=new SR(); recognition.lang='en-KE'; recognition.interimResults=false;
  recognition.onresult=e=>{ inputEl.value += e.results[0][0].transcript; };
  recognition.onend=()=>{ recognizing=false; document.getElementById('micBtn').classList.remove('recording'); };
  recognition.start(); recognizing=true; document.getElementById('micBtn').classList.add('recording');
}

inputEl.addEventListener('input', ()=>{ inputEl.style.height='auto'; inputEl.style.height=inputEl.scrollHeight+'px'; });
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });

async function sendMessage(){
  const text=inputEl.value.trim();
  if(!text && !currentImage) return;
  const userText = text || 'Edit this photo';
  addUser(userText);
  history.push(userText); localStorage.setItem('lumora_history', JSON.stringify(history.slice(-30)));

  // Image generation / edit request
  const isImageReq = /create|generate|draw|edit this|make.*image|photo/i.test(userText) && (/image|photo|picture|draw|edit/i.test(userText) || currentImage);
  inputEl.value=''; inputEl.style.height='auto';

  const thinking=document.createElement('div'); thinking.className='msg bot thinking'; thinking.textContent='🔍 Searching online...'; chatEl.appendChild(thinking); chatEl.scrollTop=chatEl.scrollHeight;

  try{
    if(isImageReq){
      const res=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:userText})});
      const data=await res.json(); thinking.remove();
      if(data.image){ const d=addBot('Hii hapa picha yako:'); d.innerHTML+=`<img class="gen" src="${data.image}">`; }
      else addBot(data.error||'Image generation failed.');
      return;
    }

    const hist=[];
    document.querySelectorAll('.msg').forEach(m=>{});
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:userText, history:[]})});
    const data=await res.json(); thinking.remove();
    if(data.error) addBot(data.error);
    else addBot(data.reply, data.sources);
    clearImage();
  }catch(e){ thinking.remove(); addBot('Pole, mtandao umekata kidogo. Jaribu tena.'); }
}

if(!chatEl.innerHTML) addBot("Habari, mimi ni Axenova AI. Niulize chochote, kuhusu KCSE, news, bei, picha, chochote.");
renderHistory();
</script>
</body>
</html>
