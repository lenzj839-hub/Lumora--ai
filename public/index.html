<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090914">
<meta name="description" content="Axenova AI — your intelligent creative assistant.">
<title>Axenova AI — By John Theuri</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<!-- Include marked.js for clean Markdown and Table rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --bg:#090914;--panel:#10101d;--panel2:#171729;--line:rgba(255,255,255,.085);
  --text:#f6f4ff;--muted:#9694ad;--purple:#8b5cf6;--pink:#ec4899;
  --grad:linear-gradient(120deg,#7657ff 0%,#b34be8 52%,#f05aab 100%);
  --shadow:0 18px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% -20%,#29204b 0%,transparent 45%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;max-width:1600px;margin:auto}
.sidebar{width:280px;flex:0 0 280px;background:rgba(13,13,25,.88);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;z-index:20;backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 26px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:0 8px 24px #8b5cf644}
.brand h1{font-size:19px;margin:0;letter-spacing:-.5px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.newchat{width:100%;padding:13px 15px;border:1px solid #a98aff55;border-radius:13px;background:linear-gradient(110deg,#7958f0,#a64de2);color:white;font-weight:700;box-shadow:0 9px 25px #8b5cf633}
.side-label{color:#77758f;text-transform:uppercase;font-size:10px;letter-spacing:1.4px;margin:27px 9px 10px}
.history{overflow:auto;flex:1}
.history-item{width:100%;text-align:left;padding:11px 12px;margin:3px 0;border:1px solid transparent;border-radius:11px;background:transparent;color:#c8c5d9;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item:hover,.history-item.active{background:#ffffff0b;border-color:var(--line);color:white}
.side-bottom{border-top:1px solid var(--line);padding:15px 7px 0;color:var(--muted);font-size:12px;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#0c0c18aa;backdrop-filter:blur(18px);z-index:5}
.top-left,.top-actions{display:flex;align-items:center;gap:12px;min-width:0}
.mobile-brand{display:none;font-weight:800;letter-spacing:-.4px}
.status{display:flex;align-items:center;gap:7px;color:#a9a6bc;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#48d69a;box-shadow:0 0 12px #48d69a}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:#dedbed;display:grid;place-items:center;font-size:17px}
.icon-btn:hover{background:#ffffff15}
.chat{flex:1;overflow-y:auto;padding:34px 22px 22px;scroll-behavior:smooth}
.chat-inner{width:min(850px,100%);margin:0 auto;display:flex;flex-direction:column;gap:20px;min-height:100%}
.welcome{margin:auto auto 35px;text-align:center;width:min(680px,100%);padding:34px 10px}
.welcome-logo{width:70px;height:70px;border-radius:23px;background:var(--grad);display:grid;place-items:center;font-size:32px;font-weight:900;margin:0 auto 22px;box-shadow:0 15px 45px #9d4de744}
.welcome h2{font-size:clamp(27px,5vw,40px);letter-spacing:-1.5px;margin:0 0 12px}
.gradient-text{background:var(--grad);background-clip:text;-webkit-background-clip:text;color:transparent}
.welcome p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto 25px;max-width:520px}
.prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}
.prompt{border:1px solid var(--line);background:linear-gradient(140deg,#ffffff0b,#ffffff04);border-radius:15px;padding:14px;color:#dedbed;text-align:left;font-size:13px;line-height:1.45}
.prompt strong{display:block;color:white;font-size:13px;margin-bottom:4px}
.prompt:hover{border-color:#a879ff88;background:#8b5cf614}
.message{display:flex;gap:12px;align-items:flex-start;max-width:100%;animation:appear .2s ease}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.message.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:12px;background:#29213f;display:grid;place-items:center;font-size:14px;font-weight:800;color:#d8c5ff}
.user .avatar{background:linear-gradient(135deg,#7958f0,#d34fb8);color:white}
.message-content{max-width:min(82%,700px);min-width:0}
.message.user .message-content{text-align:right}
.bubble{display:inline-block;text-align:left;padding:14px 16px;border-radius:17px;background:#171727;border:1px solid var(--line);line-height:1.65;font-size:14px;overflow-wrap:anywhere;max-width:100%}
.user .bubble{background:linear-gradient(130deg,#7655e9,#9a48d8);border:0;color:white;border-top-right-radius:5px;white-space:pre-wrap}
.ai .bubble{border-top-left-radius:5px}
/* Markdown styling inside AI bubbles */
.bubble table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.bubble th,.bubble td{border:1px solid rgba(255,255,255,0.15);padding:8px 10px;text-align:left}
.bubble th{background:rgba(255,255,255,0.05)}
.bubble pre{background:#0d0d17;padding:10px;border-radius:8px;overflow-x:auto}
.bubble code{font-family:monospace;background:rgba(255,255,255,0.1);padding:2px 4px;border-radius:4px}
.bubble pre code{background:transparent;padding:0}
.bubble img{display:block;max-width:min(100%,420px);max-height:360px;object-fit:contain;border-radius:12px;margin-top:10px}
.bubble a{color:#c7aaff;word-break:break-all}
.msg-tools{display:flex;gap:7px;margin-top:7px;opacity:.75}
.message.user .msg-tools{justify-content:flex-end}
.tool{border:0;background:transparent;color:#aaa7bd;font-size:11px;padding:4px 6px;border-radius:6px}
.tool:hover{background:#ffffff12;color:white}
.typing{display:flex;gap:5px;padding:6px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#b69aff;animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.composer-wrap{padding:12px 22px 22px;background:linear-gradient(transparent,#090914 25%)}
.composer{width:min(850px,100%);margin:auto;border:1px solid #ffffff20;border-radius:22px;background:#171727;box-shadow:var(--shadow);padding:10px 12px 10px 16px}
.preview{display:none;align-items:center;gap:10px;padding:3px 3px 10px}
.preview img{width:54px;height:54px;object-fit:cover;border-radius:10px}
.preview span{font-size:12px;color:var(--muted);flex:1}
.preview button{border:0;background:#ffffff18;color:white;border-radius:50%;width:27px;height:27px}
.compose-row{display:flex;align-items:center;gap:8px}
.compose-row input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white;padding:12px 4px;font-size:14px}
.compose-row input::placeholder{color:#77758e}
.send{width:43px;height:43px;border:0;border-radius:15px;background:var(--grad);color:white;font-size:20px;box-shadow:0 6px 20px #984de944}
.send:disabled{opacity:.45;cursor:default}
.composer-foot{display:flex;justify-content:space-between;align-items:center;color:#
