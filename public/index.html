}

<meta charset="UTF-8">

<link rel="manifest" href="/manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100vw}
body{background:#0f0f14;color:#fff;font-family:system-ui;display:flex;height:100vh;width:100vw}
.sidebar{width:260px;flex-shrink:0;background:#17171f;border-right:1px solid #222;padding:12px;overflow-y:auto;position:relative}
.main{flex:1;display:flex;flex-direction:column;min-width:0;width:100%}
.header{padding:16px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;min-width:0}
.header h1{background:linear-gradient(90deg,#8a2be2,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px;white-space:nowrap}
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;width:100%}
.bubble{max-width:80%;padding:12px 16px;border-radius:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:15px}
.bubble a{word-break:break-all;overflow-wrap:anywhere;display:inline-block;max-width:100%}
.user{align-self:flex-end;background:linear-gradient(135deg,#8a2be2,#c751ff)}
.ai{align-self:flex-start;background:#1e1e2a;border:1px solid #2a2a3a}
.inputBar{padding:12px;border-top:1px solid #222;display:flex;gap:8px;align-items:center;width:100%}
.inputBar input{flex:1;background:#1e1e2a;border:1px solid #333;border-radius:24px;padding:12px 18px;color:#fff;outline:none;min-width:0;font-size:15px}
.inputBar button{background:linear-gradient(135deg,#8a2be2,#ff6b9d);border:none;border-radius:50%;width:44px;height:44px;color:#fff;cursor:pointer;font-size:18px;flex-shrink:0}
.iconBtn{background:#1e1e2a;border:1px solid #333;border-radius:50%;width:42px;height:42px;color:#fff;cursor:pointer;flex-shrink:0}
@media (max-width:700px){
  .sidebar{display:none;position:fixed;left:0;top:0;bottom:0;z-index:50;height:100vh;box-shadow:0 0 40px #000}
  .bubble{max-width:92%;font-size:15px}
  .chat{padding:12px}
  .header{padding:12px}
  .header h1{font-size:18px}
  .header span{display:none}
}
</style>
</head>
<body>

<button onclick="closeSidebar()" style="position:absolute;top:10px;right:10px;background:#2a2a3a;border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;z-index:51">✕</button>
<h3>Axenova AI</h3>
<p style="font-size:12px;color:#888;margin:8px 0">By John Theuri lenz.itz<br>Answers everything except porn</p>
<div id="history"></div>
</div>
<div class="main">
<div class="header">
<div style="display:flex;gap:12px;align-items:center;min-width:0">
<button onclick="toggleSidebar()" style="background:none;border:none;color:#fff;font-size:22px;flex-shrink:0">☰</button>
<h1>Axenova AI</h1>
<span style="font-size:12px;color:#888">Answers everything except porn, ChatGPT-like, internet, camera, mic</span>
</div>
<div>
<button class="iconBtn" onclick="document.getElementById('fileInput').click()">🖼️</button>
<button class="iconBtn" onclick="startCamera()">📷</button>
</div>
</div>
<div class="chat" id="chat">
<div class="bubble ai">Hey there I'm Axenova, what do you want us to create today? 🚀 I answer everything except pornographic questions!</div>
</div>
<div class="inputBar">
<input type="file" id="fileInput" accept="image/*" hidden onchange="handleImage(this)">
<button class="iconBtn" onclick="document.getElementById('fileInput').click()" title="Upload">🖼️</button>
