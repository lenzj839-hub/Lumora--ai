<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumora AI</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0a1a;color:#fff;font-family:system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #2a2140;background:#140e24}.logo{font-size:20px;font-weight:800}.sub{font-size:12px;color:#b8aee0}.sp{flex:1}.ib{background:#241a3d;border:1px solid #372a5c;color:#fff;width:36px;height:36px;border-radius:10px;font-size:18px}#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.msg{max-width:92%;padding:13px;border-radius:16px;line-height:1.55;font-size:15px;word-wrap:break-word}.user{align-self:flex-end;background:linear-gradient(135deg,#d946a8,#8b5cf6)}.bot{align-self:flex-start;background:#221838;border:1px solid #32245a;width:92%}.bot a{color:#c084fc;word-break:break-all}.bot ul{margin-left:18px}.src{margin-top:10px;border-top:1px solid #372a5c;padding-top:8px;font-size:13px}.src a{display:block;margin-top:5px;color:#c084fc;text-decoration:none}#box{padding:10px;background:#140e24;border-top:1px solid #2a2140}#in{display:flex;gap:8px;background:#221838;border:1px solid #372a5c;border-radius:18px;padding:8px}textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:15px;resize:none;font-family:inherit}button{border:0;cursor:pointer}.rb{width:42px;height:42px;border-radius:50%;font-size:18px;background:#241a3d;color:#fff}#send{background:linear-gradient(135deg,#d946a8,#8b5cf6);color:#fff}.rec{background:#ef4444!important}#pv{display:none;margin-bottom:8px}#pv img{width:100px;border-radius:10px}input[type=file]{display:none}</style></head><body>
<header><button class="ib" onclick="alert('History: '+(JSON.parse(localStorage.getItem('h')||'[]').length)+' chats')">☰</button><div><div class="logo">Lumora AI</div><div class="sub">ChatGPT-like with self-search, camera, mic</div></div><div class="sp"></div><button class="ib" onclick="document.getElementById('f1').click()">🖼️</button><button class="ib" onclick="document.getElementById('f2').click()">📷</button></header>
<div id="chat"></div>
<div id="box"><div id="pv"><img id="pvi"></div><div id="in"><button class="rb" onclick="document.getElementById('f1').click()">🖼️</button><button class="rb" onclick="document.getElementById('f2').click()">📷</button><textarea id="t" rows="1" placeholder="Ask Lumora..."></textarea><button class="rb" id="mic" onclick="mic()">🎤</button><button class="rb" id="send" onclick="send()">➤</button></div></div>
<input type="file" id="f1" accept="image/*" onchange="img(this)"><input type="file" id="f2" accept="image/*" capture="environment" onchange="img(this)">
<script>
const chat=document.getElementById('chat'),ta=document.getElementById('t');let curImg=null,rec=null,on=false;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function md(x){let t=esc(x);t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');t=t.replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>');t=t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>');return t.replace(/\n/g,'<br>')}
function add(c,html){const d=document.createElement('div');d.className='msg '+c;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function bot(text,src){let h=md(text);if(src&&src.length){h+='<div class="src"><b>🔍 Sources</b>';src.forEach(s=>h+=`<a href="${s.link}" target="_blank">• ${esc(s.title||s.link)}</a>`);h+='</div>'}add('bot',h)}
function img(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{curImg=e.target.result;document.getElementById('pvi').src=curImg;document.getElementById('pv').style.display='block'};r.readAsDataURL(f)}
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Mic: jaribu Chrome');return}if(on){rec.stop();return}rec=new SR();rec.lang='en-KE';rec.onresult=e=>ta.value+=e.results[0][0].transcript;rec.onend=()=>{on=false;document.getElementById('mic').classList.remove('rec')};rec.start();on=true;document.getElementById('mic').classList.add('rec')}
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
async function send(){const v=ta.value.trim();if(!v)return;add('user',esc(v));let h=JSON.parse(localStorage.getItem('h')||'[]');h.push(v);localStorage.setItem('h',JSON.stringify(h.slice(-20)));ta.value='';const th=add('bot','🔍 Searching online...');try{const isImg=/create|generate|draw|edit|image|photo|picture/i.test(v);if(isImg&&/image|photo|picture|draw|create|edit/i.test(v)){const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:v})});const d=await r.json();th.remove();if(d.image)bot('Hii hapa: <br><img style="max-width:100%;border-radius:12px" src="'+d.image+'">');else bot(d.error||'Image failed.');return}const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,history:[]})});const d=await r.json();th.remove();bot(d.error||d.reply,d.sources)}catch(e){th.remove();bot('Pole, jaribu tena.')}}
bot("Habari, mimi ni Lumora AI. Niulize chochote, KCSE, news, bei, picha.");
</script></body></html>
